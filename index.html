<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computer Shop Billing CRM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#182238;font:14px system-ui,Arial}header{background:#13213e;color:#fff;padding:18px;display:flex;justify-content:space-between;gap:10px}main{max-width:1100px;margin:20px auto;padding:0 14px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{border:0;border-radius:7px;padding:9px 13px;background:#2858d8;color:white;cursor:pointer;font-weight:600}.secondary{background:#e6ebf4;color:#26334d}.danger{background:#b42318}.panel{background:white;border:1px solid #e0e5ef;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:12px;color:#667085}input,textarea,select{width:100%;padding:9px;border:1px solid #d4dbe7;border-radius:7px;font:inherit}.wide{grid-column:span 2}.full{grid-column:1/-1}table{border-collapse:collapse;width:100%;min-width:700px}td,th{padding:8px;border-bottom:1px solid #e3e7ef;text-align:left}th{background:#f7f8fb;font-size:12px}.scroll{overflow:auto}.amount{text-align:right;white-space:nowrap}.total{text-align:right;font-size:18px;font-weight:bold;margin:12px}.hidden{display:none!important}.note{font-size:12px;color:#667085}@media(max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:450px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}}
#print{display:none}@page{size:A5 portrait;margin:8mm}@media print{body *{visibility:hidden!important}#print,#print *{visibility:visible!important}#print{display:block!important;position:absolute;inset:0;font:9pt Arial;color:#111}#print h1{font-size:17pt;margin:0}#print table{min-width:0;font-size:8pt}#print th,#print td{border:1px solid #111;padding:4px;background:white}.phead{display:flex;justify-content:space-between;border-bottom:2px solid;margin-bottom:8px;padding-bottom:8px}.pmeta{display:grid;grid-template-columns:1fr 1fr;margin:8px 0}.pfoot{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin-top:8px}.terms{white-space:pre-wrap;font-size:8pt}.ptotal{text-align:right;font-size:12pt;font-weight:bold}.sign{display:flex;justify-content:space-between;margin-top:35px}}
</style></head><body>
<header><div><b id="brand">Computer Shop Billing CRM</b><div class="note" style="color:#d7deee">Non-GST Estimate / Cash Memo · No stock or cash drawer</div></div><button class="secondary" onclick="tab('settings')">Settings</button></header>
<main><nav class="tabs"><button id="btab" onclick="tab('bill')">New Bill</button><button id="htab" class="secondary" onclick="tab('history')">Invoice History</button><button id="stab" class="secondary" onclick="tab('settings')">Shop Settings</button></nav>
<section id="bill">
<div class="panel"><h3>Bill details</h3><div class="grid">
<div class="field"><label>Memo No.</label><input id="no"></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Type</label><select id="type"><option>Cash Memo</option><option>Estimate</option></select></div><div class="field"><label>Customer name</label><input id="cust"></div><div class="field"><label>Mobile</label><input id="phone"></div><div class="field wide"><label>Address</label><input id="address"></div></div></div>
<div class="panel"><h3>Manual items</h3><div class="scroll"><table><thead><tr><th>#</th><th>Description</th><th>Qty</th><th>Rate ₹</th><th>Amount ₹</th><th>Serial / Warranty note</th><th></th></tr></thead><tbody id="items"></tbody></table></div><div class="actions"><button class="secondary" onclick="add()">+ Add item</button></div><div class="total">Total: <span id="sum">₹0.00</span></div><div class="field"><label>Amount in words (optional)</label><input id="words"></div></div>
<div class="panel"><div class="grid"><div class="field wide"><label>Notes</label><textarea id="memo"></textarea></div><div class="field wide"><label>Terms & Conditions</label><textarea id="terms"></textarea></div></div><div class="actions"><button onclick="save()">Save bill</button><button class="secondary" onclick="printBill()">Print A5 / Save PDF</button><button class="secondary" onclick="fresh()">New / Clear</button></div><p class="note">Saved in this browser. Export a backup from History.</p></div></section>
<section id="history" class="hidden"><div class="panel"><h3>Invoice History</h3><div class="grid"><div class="field"><label>Financial Year (Apr–Mar)</label><select id="fy" onchange="render()"></select></div><div class="field"><label>From date</label><input id="from" type="date" onchange="render()"></div><div class="field"><label>To date</label><input id="to" type="date" onchange="render()"></div><div class="field"><label>Customer / mobile</label><input id="search" oninput="render()"></div></div><div class="actions"><button class="secondary" onclick="clearF()">Clear filters</button><button class="secondary" onclick="backup()">Export JSON backup</button><button class="secondary" onclick="document.getElementById('file').click()">Import backup</button><input class="hidden" id="file" type="file" accept="application/json" onchange="restore(event)"></div><div class="scroll"><table><thead><tr><th>No.</th><th>Date</th><th>Customer</th><th>Type</th><th>Total</th><th>Action</th></tr></thead><tbody id="historyRows"></tbody></table></div><p id="summary" class="note"></p></div></section>
<section id="settings" class="hidden"><div class="panel"><h3>Shop Settings</h3><div class="grid"><div class="field"><label>Shop name</label><input id="shop"></div><div class="field"><label>Phone</label><input id="shopPhone"></div><div class="field wide"><label>Address</label><input id="shopAddress"></div><div class="field wide"><label>Default Terms & Conditions</label><textarea id="defaultTerms"></textarea></div><div class="field"><label>Invoice prefix</label><input id="prefix"></div></div><div class="actions"><button onclick="saveSettings()">Save settings</button></div></div></section></main><div id="print"></div>
<script>
const $=id=>document.getElementById(id),cash=n=>'₹'+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let bills=JSON.parse(localStorage.getItem('billing_bills')||'[]'),cfg=JSON.parse(localStorage.getItem('billing_settings')||'null')||{shop:'Computer Shop',shopPhone:'',shopAddress:'',prefix:'CM',defaultTerms:'1. Goods once sold will not be taken back.\n2. Warranty as per manufacturer policy.\n3. Keep this memo for warranty claims.'},edit=null;
function saveData(){localStorage.setItem('billing_bills',JSON.stringify(bills))}
function today(){return new Date().toISOString().slice(0,10)}
function fy(d){let x=new Date(d+'T12:00:00'),y=x.getFullYear();return x.getMonth()>=3?y+'-'+String(y+1).slice(-2):(y-1)+'-'+String(y).slice(-2)}
function nextNo(){let nums=bills.map(b=>+(b.no||'').replace(/^\D+/,'')||0);return (cfg.prefix||'CM')+'-'+String(Math.max(0,...nums)+1).padStart(4,'0')}
function tab(t){['bill','history','settings'].forEach(x=>{$(x).classList.toggle('hidden',x!==t);$(x+'tab')?.classList.toggle('secondary',x!==t)});if(t==='history')render();if(t==='settings')loadSettings()}
function add(v={}){let r=document.createElement('tr');r.innerHTML='<td></td><td><input class="desc" placeholder="Part / service" value="'+esc(v.desc)+'"></td><td><input class="qty" type="number" min="0" step="any" value="'+(v.qty??1)+'"></td><td><input class="rate" type="number" min="0" step="any" value="'+(v.rate??0)+'"></td><td class="amount">₹0.00</td><td><input class="serial" placeholder="Serial / warranty" value="'+esc(v.serial)+'"></td><td><button class="danger" onclick="this.closest(\'tr\').remove();calc()">×</button></td>';$('items').append(r);r.querySelectorAll('.qty,.rate').forEach(x=>x.oninput=calc);calc()}
function lines(){return [...$('items').rows].map(r=>({desc:r.querySelector('.desc').value.trim(),qty:+r.querySelector('.qty').value||0,rate:+r.querySelector('.rate').value||0,serial:r.querySelector('.serial').value.trim()})).filter(x=>x.desc||x.serial||x.rate)}
function calc(){let total=0;[...$('items').rows].forEach((r,i)=>{r.cells[0].textContent=i+1;let a=(+r.querySelector('.qty').value||0)*(+r.querySelector('.rate').value||0);total+=a;r.querySelector('.amount').textContent=cash(a)});$('sum').textContent=cash(total)}
function fresh(){edit=null;['cust','phone','address','words','memo'].forEach(x=>$(x).value='');$('date').value=today();$('no').value=nextNo();$('type').value='Cash Memo';$('terms').value=cfg.defaultTerms;$('items').innerHTML='';add()}
function billObj(){let it=lines();return {id:edit||'b'+Date.now(),no:$('no').value||nextNo(),date:$('date').value||today(),type:$('type').value,cust:$('cust').value.trim(),phone:$('phone').value.trim(),address:$('address').value.trim(),items:it,total:it.reduce((s,x)=>s+x.qty*x.rate,0),words:$('words').value,memo:$('memo').value,terms:$('terms').value}}
function save(){let b=billObj();if(!b.cust||!b.items.length){alert('Enter customer name and at least one item.');return}let i=bills.findIndex(x=>x.id===b.id);if(i<0)bills.unshift(b);else bills[i]=b;saveData();edit=b.id;alert('Bill saved.')}
function openBill(id){let b=bills.find(x=>x.id===id);if(!b)return;edit=id;tab('bill');$('no').value=b.no;$('date').value=b.date;$('type').value=b.type;$('cust').value=b.cust;$('phone').value=b.phone;$('address').value=b.address;$('words').value=b.words||'';$('memo').value=b.memo||'';$('terms').value=b.terms||cfg.defaultTerms;$('items').innerHTML='';b.items.forEach(add);calc()}
function render(){let f=$('fy').value,q=$('search').value.toLowerCase(),from=$('from').value,to=$('to').value;let arr=bills.filter(b=>(f==='all'||fy(b.date)===f)&&(!from||b.date>=from)&&(!to||b.date<=to)&&(!q||(b.cust+' '+b.phone).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));$('historyRows').innerHTML=arr.map(b=>'<tr><td>'+esc(b.no)+'</td><td>'+esc(b.date)+'</td><td>'+esc(b.cust)+'<br>'+esc(b.phone)+'</td><td>'+esc(b.type)+'</td><td>'+cash(b.total)+'</td><td><button onclick="openBill(\''+b.id+'\')">Open</button> <button class="secondary" onclick="printSaved(\''+b.id+'\')">Print</button> <button class="danger" onclick="del(\''+b.id+'\')">Delete</button></td></tr>').join('')||'<tr><td colspan="6">No bills found.</td></tr>';$('summary').textContent=arr.length+' bills · '+cash(arr.reduce((s,b)=>s+b.total,0))}
function initFY(){let set=new Set([fy(today()),...bills.map(b=>fy(b.date))]),y=+fy(today()).slice(0,4);for(let i=y-8;i<=y+1;i++)set.add(i+'-'+String(i+1).slice(-2));$('fy').innerHTML='<option value="all">All years</option>'+[...set].sort().reverse().map(x=>'<option>'+x+'</option>').join('');$('fy').value=fy(today())}
function clearF(){$('fy').value='all';$('from').value=$('to').value=$('search').value='';render()}
function del(id){if(confirm('Delete this bill permanently?')){bills=bills.filter(b=>b.id!==id);saveData();render()}}
function printSaved(id){openBill(id);printBill()}
function printBill(){let b=billObj();if(!b.cust){alert('Enter customer name first.');return}let rows=b.items.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.desc)+'</td><td>'+x.qty+'</td><td>'+cash(x.rate)+'</td><td>'+cash(x.qty*x.rate)+'</td><td>'+esc(x.serial)+'</td></tr>').join('');$('print').innerHTML='<div class="phead"><div><h1>'+esc(cfg.shop)+'</h1><p>'+esc(cfg.shopAddress)+'<br>'+esc(cfg.shopPhone)+'</p></div><div style="text-align:right"><b>NON-GST</b><p>'+esc(b.type)+'<br>Memo: '+esc(b.no)+'<br>Date: '+esc(b.date)+'</p></div></div><h3 style="text-align:center">'+esc(b.type.toUpperCase())+'</h3><div class="pmeta"><div><b>Customer:</b> '+esc(b.cust)+'<br><b>Mobile:</b> '+esc(b.phone||'—')+'</div><div><b>Address:</b> '+esc(b.address||'—')+'</div></div><table><thead><tr><th>#</th><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th><th>Serial / Warranty</th></tr></thead><tbody>'+rows+'</tbody></table><div class="pfoot"><div><b>Note:</b> '+esc(b.memo||'—')+'<p class="terms"><b>Terms & Conditions</b><br>'+esc(b.terms)+'</p></div><div class="ptotal">Total: '+cash(b.total)+'<p style="font-size:9pt;font-weight:normal">'+esc(b.words)+'</p></div></div><div class="sign"><span>Customer Signature</span><span>For '+esc(cfg.shop)+'<br><br>Authorized Signature</span></div>';window.print()}
function loadSettings(){['shop','shopPhone','shopAddress','prefix','defaultTerms'].forEach(k=>$(k).value=cfg[k]||'')}
function saveSettings(){['shop','shopPhone','shopAddress','prefix','defaultTerms'].forEach(k=>cfg[k]=$(k).value.trim());localStorage.setItem('billing_settings',JSON.stringify(cfg));$('brand').textContent=cfg.shop||'Computer Shop Billing CRM';if(!edit)$('terms').value=cfg.defaultTerms;alert('Settings saved.')}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({bills,settings:cfg},null,2)],{type:'application/json'}));a.download='billing-backup.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.bills))throw Error('Invalid backup');if(confirm('Replace existing bills with backup?')){bills=d.bills;cfg=d.settings||cfg;saveData();localStorage.setItem('billing_settings',JSON.stringify(cfg));initFY();render();alert('Imported')}}catch(x){alert(x.message)}};r.readAsText(f);e.target.value=''}
$('brand').textContent=cfg.shop||'Computer Shop Billing CRM';$('date').value=today();$('terms').value=cfg.defaultTerms;initFY();fresh();
</script></body></html>
